---
name: Publish Puppet Module
'on':
  push:
    tags:
      - '*'
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: ${{ github.workspace }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          image: shinesolutions/aem-platform-buildenv:6.4.1
          shell: bash
          extra_args: -e BLACKSMITH_FORGE_API_KEY
          command: |
            make clean deps package publish
        env:
          BLACKSMITH_FORGE_API_KEY: ${{ secrets.SHINEOPENSOURCE_PUPPETFORGE_TOKEN }}
