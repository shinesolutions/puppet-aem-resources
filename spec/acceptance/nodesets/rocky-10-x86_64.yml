---
HOSTS:
  rocky-10-x86_64:
    roles:
      - default
    platform: el-10-x86_64
    image: rockylinux/rockylinux:10
    hypervisor: docker
    # Keep the built image so these layers are cached between runs. The agent is
    # baked in, so the agent install in spec_helper_acceptance.rb is a no-op.
    docker_preserve_image: true
    docker_image_commands:
      - dnf install -y https://yum.voxpupuli.org/openvox9-release-el-10.noarch.rpm
      - dnf install -y openvox-agent
    docker_cmd: '["/sbin/init"]'
    image_outer_ports:
      - 22
CONFIG:
  type: aio
